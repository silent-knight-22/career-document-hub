## ==========================================
## EXAMPLE configuration — safe to commit
## ==========================================
## Copy values into environment variables, or copy this file to
## application-local.properties and fill in placeholders.
## NEVER put real passwords or JWT secrets in committed files.

spring.application.name=career-document-hub
server.port=8080

# Replace with your MongoDB connection string (Atlas or local).
# Example local: mongodb://localhost:27017
# Example Atlas: mongodb+srv://USERNAME:PASSWORD@CLUSTER/career_document_hub
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=career_document_hub

# Comma-separated browser origins (no wildcards in production).
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173

# Phase 2: generate a long random secret (32+ chars). Leave empty for Phase 1.
app.security.jwt.secret=

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
