## ==========================================
## Career Document Hub — Application Config
## ==========================================
## Secrets MUST come from environment variables or from the gitignored
## application-local.properties (activate with spring.profiles.active=local).
## Never commit real credentials. See application-example.properties and .env.example.

spring.application.name=career-document-hub

# ==================== SERVER ====================
server.port=${SERVER_PORT:8084}

# ==================== MONGODB ====================
# Safe local default: local MongoDB without credentials.
# Override with MONGODB_URI / MONGODB_DATABASE for Atlas or remote hosts.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:career_document_hub}

# ==================== CORS ====================
# Comma-separated origins for the React (Vite) frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

# ==================== JWT ====================
# Signing secret from environment only — never commit real values.
# Must be at least 32 UTF-8 bytes for HS256.
app.security.jwt.secret=${JWT_SECRET}
# Access token lifetime (minutes). Default: 60.
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ==================== FILE STORAGE ====================
# Relative/absolute directory for local file storage (never commit real secrets here).
app.storage.local-root=${STORAGE_LOCAL_ROOT:./data/storage}

# Multipart limits (signed artifacts may exceed the 3 MB original-document limit).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Ensure unique email index is created from @Indexed
spring.data.mongodb.auto-index-creation=true

# ==================== ACTUATOR ====================
# Only expose health. Remains outside /api/v1 by design (ops endpoint).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Phase 1: liveness without requiring a live Mongo ping (DB usage begins in later phases).
# Re-enable mongo health (or a readiness group) once repositories are in use.
management.health.mongo.enabled=false

# ==================== SPRINGDOC / SWAGGER ====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false

# ==================== LOGGING ====================
# Do not enable DEBUG for Mongo URI / driver wiring in shared environments.
logging.level.root=INFO
logging.level.com.careerdocumenthub=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.mongodb.driver=WARN
