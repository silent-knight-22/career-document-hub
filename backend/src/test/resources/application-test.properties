## ==========================================
## Test profile — credential-free
## ==========================================
## Uses flapdoodle embedded Mongo (test scope). No Atlas / production URIs.
## Docker is not required on the developer workstation.

spring.data.mongodb.database=career_document_hub_test
de.flapdoodle.mongodb.embedded.version=7.0.14

app.cors.allowed-origins=http://localhost:5173
app.security.jwt.secret=

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mongo.enabled=false

logging.level.com.careerdocumenthub=INFO
logging.level.org.springframework.security=WARN
