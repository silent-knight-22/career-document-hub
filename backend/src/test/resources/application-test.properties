## ==========================================
## Test profile — credential-free
## ==========================================
## Uses flapdoodle embedded Mongo (test scope). No Atlas / production URIs.

spring.data.mongodb.database=career_document_hub_test
spring.data.mongodb.auto-index-creation=true
de.flapdoodle.mongodb.embedded.version=7.0.14

app.cors.allowed-origins=http://localhost:5173
# Test-only signing key (not a production secret). Min 32 characters.
app.security.jwt.secret=test-only-cdh-jwt-secret-key-32chars-min
app.security.jwt.expiration-minutes=60

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mongo.enabled=false

logging.level.com.careerdocumenthub=INFO
logging.level.org.springframework.security=WARN
